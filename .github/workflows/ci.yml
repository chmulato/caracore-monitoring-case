name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-speedviolation-api:
    name: Test SpeedViolation API (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test (SpeedViolation)
        run: mvn clean verify

  test-monitoramento-api:
    name: Test Monitoramento API (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test (Monitoramento)
        working-directory: ./backend
        run: mvn clean verify

  test-frontend:
    name: Test Frontend (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/caracore-monitoring-case/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend/caracore-monitoring-case
        run: npm ci

      - name: Run Tests
        working-directory: ./frontend/caracore-monitoring-case
        run: npm run test -- --run

      - name: Verify Build
        working-directory: ./frontend/caracore-monitoring-case
        run: npm run build
