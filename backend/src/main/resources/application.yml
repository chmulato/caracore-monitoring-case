server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:monitoramento;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  task:
    scheduling:
      pool:
        size: 5

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.mulato.velsis.monitoramento: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
